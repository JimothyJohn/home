name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate HTML parses and internal links resolve
        run: |
          python3 - <<'PY'
          import html.parser, pathlib, sys

          class Check(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  for k, v in attrs:
                      if k == "href" and v and not v.startswith(("http", "mailto:", "#")):
                          self.links.append(v)

          ok = True
          for f in pathlib.Path(".").glob("*.html"):
              c = Check()
              c.feed(f.read_text())
              for link in c.links:
                  if not pathlib.Path(link).exists():
                      print(f"{f}: broken local link {link}")
                      ok = False
              print(f"{f}: parsed, {len(c.links)} local links checked")
          sys.exit(0 if ok else 1)
          PY

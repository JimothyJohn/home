<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.col{position:absolute;top:74px}
.lab{font-size:11px;color:#8a8a8a;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.wire{left:28px;width:330px;font-size:12.5px;line-height:1.75}
.req{color:#FFC20E}.dim{color:#7a7a7a}
.regs{display:grid;grid-template-columns:repeat(6,48px);gap:4px;margin:6px 0 14px}
.regs span{display:block;text-align:right;padding:2px 4px;background:#1e1e1e;border:1px solid #333;border-radius:3px;font-size:12px;color:#F0F0F0}
.joints{left:390px;width:540px}
.j{display:inline-block;width:166px;margin:0 8px 14px 0;vertical-align:top}
.j svg{display:block}
.jv{font-size:12px;color:#F0F0F0;margin-top:2px}.jv b{color:#3DD68C;font-weight:600}
.st{position:absolute;left:28px;right:28px;bottom:36px;font-size:12.5px;color:#a8a8a8;border-top:1px solid #333;padding-top:9px}
.st .k{color:#FFC20E}
</style></head><body><div id="s">
<div class="hdr"><span class="t">Universal Robots over Modbus TCP</span><span class="s">UR e-Series · port 502</span></div>
<div class="col wire"><div class="lab">on the wire</div><div id="w"></div></div>
<div class="col joints"><div class="lab">joint angles, decoded</div><div id="J"></div></div>
<div class="st" id="st"></div>
<div class="ft">Register values as captured from Universal Robots' URSim (PolyScope X 10.13), 2026-11-20. Decoding as in the ST example.</div>
</div><script>
const ang=[4682,4556,4080,5475,1595,6252], turnsRaw=[65535,65535,65535,65535,0,65535];
const turns=turnsRaw.map(v=>v>=32768?v-65536:v), mrad=ang.map((a,i)=>turns[i]*6283+a);
const names=['base','shoulder','elbow','wrist 1','wrist 2','wrist 3'];
const w=document.getElementById('w'), J=document.getElementById('J'), st=document.getElementById('st');
function regs(vals,n){return '<div class="regs">'+vals.map((v,i)=>`<span style="opacity:${i<n?1:.15}">${i<n?v:'·'}</span>`).join('')+'</div>'}
J.innerHTML=names.map((n,i)=>`<div class="j"><svg width="166" height="74" viewBox="0 0 166 74"><path d="M25 70 A58 58 0 0 1 141 70" fill="none" stroke="#2c2c2c" stroke-width="6"/><circle cx="83" cy="70" r="4" fill="#5a5a5a"/><line id="n${i}" x1="83" y1="70" x2="83" y2="16" stroke="#FFC20E" stroke-width="3" stroke-linecap="round"/></svg><div class="jv">${n}: <b id="v${i}">·</b></div></div>`).join('');
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
window.render=function(t){
  const n1=Math.max(0,Math.min(6,Math.floor((t-0.6)/0.18))), n2=Math.max(0,Math.min(6,Math.floor((t-2.4)/0.18)));
  w.innerHTML=`<div class="req">→ read holding 270..275</div><div class="dim">angle inside one turn, mrad</div>${regs(ang,n1)}`+
    (t>1.9?`<div class="req">→ read holding 320..325</div><div class="dim">whole turns, signed (65535 = -1)</div>${regs(turnsRaw,n2)}`:'');
  const k=ease((t-3.9)/1.6);
  mrad.forEach((m,i)=>{const r=m/1000*k; const a=Math.max(-Math.PI,Math.min(Math.PI,r))/2;
    const x=83+52*Math.sin(a), y=70-52*Math.cos(a);
    const nl=document.getElementById('n'+i); nl.setAttribute('x2',x.toFixed(1)); nl.setAttribute('y2',y.toFixed(1));
    document.getElementById('v'+i).textContent=t>3.9?(r).toFixed(3)+' rad':'·';});
  st.innerHTML=t>5.6?`<span class="k">base_mrad</span> := turns × 6283 + angle  →  -1 × 6283 + 4682 = <span class="k">-1601</span> mrad. Register 270 alone would say +4.682 rad.`:'';
};
render(0);
</script></body></html>
